version: 1

indices:
  # Adventure detail pages under /us/en/adventures/<slug>. Powers the dynamic,
  # index-driven adventure cards on the homepage teaser and the Adventures
  # listing (blocks/adventure-cards). Each detail page's own metadata is the
  # single source of truth — no adventure content is hardcoded in JS or authored
  # into the listing document.
  adventures:
    include:
      - '/us/en/adventures/**'
    exclude:
      # the Adventures landing page itself is not an adventure card
      - '/us/en/adventures'
    target: /us/en/adventures/query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, "content")
      description:
        select: head > meta[property="og:description"]
        value: attribute(el, "content")
      cardDescription:
        # Optional short blurb shown on the card instead of the full
        # og:description (meta[name="card-description"], injected at import from
        # SLUG_CARD_DESCRIPTION). Lets an author give a card a tighter teaser —
        # e.g. "Siegel River Australia" for Riverside Camping — without changing
        # the page's SEO description. The adventure-cards block prefers this.
        select: head > meta[name="card-description"]
        value: attribute(el, "content")
      image:
        select: head > meta[property="og:image"]
        value: attribute(el, "content")
      category:
        select: head > meta[name="category"]
        value: attribute(el, "content")
      order:
        # Author-controlled sort position (meta[name="order"] on each detail page,
        # injected at import from SLUG_ORDER). Stored as the raw string; the
        # adventure-cards block parses it to a number and sorts ascending before
        # applying its limit, so e.g. limit=5 shows the five lowest-order
        # adventures. Missing/blank order sorts last (see the block).
        select: head > meta[name="order"]
        value: attribute(el, "content")
      lastModified:
        select: none
        value: parseTimestamp(headers("last-modified"), "ddd, DD MMM YYYY hh:mm:ss GMT")

  # Magazine article pages under /us/en/magazine/<slug>. Powers the dynamic,
  # index-driven "Recent Articles" cards on the homepage (blocks/magazine-cards).
  # Same pattern as `adventures`: each article's own head metadata is the single
  # source of truth — no article content is hardcoded in JS or authored into the
  # homepage document.
  magazine:
    include:
      - '/us/en/magazine/**'
    exclude:
      # the Magazine landing page itself is not an article card
      - '/us/en/magazine'
    target: /us/en/magazine/query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, "content")
      description:
        select: head > meta[property="og:description"]
        value: attribute(el, "content")
      cardDescription:
        # Optional short blurb shown on the card instead of the full
        # og:description (meta[name="card-description"], injected at import from
        # SLUG_CARD_DESCRIPTION). Lets an author give a card a tighter teaser —
        # e.g. "Best beach breaks" for San Diego — without changing the page's
        # SEO description. The magazine-cards block prefers this when present.
        select: head > meta[name="card-description"]
        value: attribute(el, "content")
      image:
        select: head > meta[property="og:image"]
        value: attribute(el, "content")
      cardImage:
        # Optional card thumbnail shown instead of the article's og:image (hero).
        # The source homepage/landing cards use a distinct per-article thumbnail
        # (meta[name="card-image"], injected at import from SLUG_CARD_IMAGE), not
        # the article's lead image. The magazine-cards block prefers this.
        select: head > meta[name="card-image"]
        value: attribute(el, "content")
      order:
        # Author-controlled sort position for the HOMEPAGE "Recent Articles"
        # teaser (meta[name="order"], injected from SLUG_ORDER). The
        # magazine-cards block sorts ascending before applying its limit.
        select: head > meta[name="order"]
        value: attribute(el, "content")
      listOrder:
        # Author-controlled sort position for the magazine landing "All Articles"
        # grid (meta[name="list-order"], injected from SLUG_LIST_ORDER). The same
        # articles appear in a different order here than in the homepage teaser,
        # so this is a separate column the landing's magazine-cards sorts by.
        select: head > meta[name="list-order"]
        value: attribute(el, "content")
      lastModified:
        select: none
        value: parseTimestamp(headers("last-modified"), "ddd, DD MMM YYYY hh:mm:ss GMT")
