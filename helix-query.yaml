version: 1

indices:
  # Adventure detail pages under /us/en/adventures/<slug>. Powers the dynamic,
  # index-driven adventure cards on the homepage teaser and the Adventures
  # listing (blocks/adventure-cards). Each detail page's own metadata is the
  # single source of truth — no adventure content is hardcoded in JS or authored
  # into the listing document.
  adventures:
    include:
      - '/us/en/adventures/**'
    exclude:
      # the Adventures landing page itself is not an adventure card
      - '/us/en/adventures'
    target: /us/en/adventures/query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, "content")
      description:
        select: head > meta[property="og:description"]
        value: attribute(el, "content")
      image:
        select: head > meta[property="og:image"]
        value: attribute(el, "content")
      category:
        select: head > meta[name="category"]
        value: attribute(el, "content")
      lastModified:
        select: none
        value: parseTimestamp(headers("last-modified"), "ddd, DD MMM YYYY hh:mm:ss GMT")
